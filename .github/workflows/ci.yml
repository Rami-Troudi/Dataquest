name: CI — Insurance Bundle Recommender

on:
  push:
    branches: [main, youssef]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 solution.py explainability.py api/ --max-line-length=120 --ignore=E501,W503,E402

      - name: Validate solution.py contract
        run: |
          python -c "
          from solution import preprocess, load_model, predict
          print('✓ solution.py exports are valid')
          "

      - name: Validate explainability module
        run: |
          python -c "
          from explainability import build_global_feature_importance, build_local_reason_codes
          print('✓ explainability.py exports are valid')
          "

      - name: Validate API imports
        run: |
          python -c "
          from api.schemas import PredictRequest, PredictResponse, HealthResponse, ExplainGlobalResponse
          from api.main import app
          print('✓ API module imports are valid')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t insurance-recommender:test .

      - name: Verify container starts
        run: |
          docker run -d --name test-container -p 8000:8000 insurance-recommender:test
          sleep 8
          curl -f http://localhost:8000/health || (docker logs test-container && exit 1)
          docker stop test-container
          docker rm test-container

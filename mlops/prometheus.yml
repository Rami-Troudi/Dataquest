global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'insurance-mlops'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mlops-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['mlops-api:8000']
    scrape_interval: 5s

  - job_name: 'nginx'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['nginx:9113']
